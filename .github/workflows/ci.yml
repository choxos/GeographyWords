name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://geowords.xera.ac
      # Map layer expressions are invisible to tsc and to next build: a bad
      # one fails only inside MapLibre at runtime, dropping the layer.
      - run: npm run validate:layers
      # Titles and descriptions are composed from prose fields, so one long
      # hook is enough to push a page past what a search result shows.
      - run: npm run validate:seo
      # Page metadata replaces the root's openGraph block rather than merging
      # into it, so a page that sets a title drops og:site_name without a
      # word from tsc. This reads the built HTML instead of the source.
      - run: npm run validate:built
      - run: npx playwright install --with-deps chromium
      # The map is only exercised by a real browser against a real build: the
      # two bugs this suite exists for both passed tsc, eslint and next build.
      - run: npm run test:e2e
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: https://geowords.xera.ac

  data:
    # Every entry cites a Wikidata id as its evidence. 45 of the original 74
    # were wrong, so this is a release gate rather than a convenience script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate-places.py
      # Every Wiktionary category member has to be either published or
      # declined with a reason. "All the words" cannot mean a pin for all
      # 887 of them; it means none of them goes missing without a record.
      - run: python3 scripts/coverage-ledger.py
